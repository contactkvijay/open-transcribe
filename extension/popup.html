<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Transcribe</title>
  </head>
  <body>
    <header>
      <h1>Transcribe</h1>
      <div id="status"></div>
    </header>

    <section id="signin-section" hidden>
      <p class="muted">Sign in with Google to start using the extension.</p>
      <button id="signin-btn" class="primary">Sign in with Google</button>
      <a id="open-options" href="#">Open options</a>
    </section>

    <section id="signedin-section" hidden>
      <div class="user-row">
        <img id="avatar" alt="" />
        <div>
          <div id="username"></div>
          <div id="email" class="muted"></div>
        </div>
        <button id="signout-btn" class="ghost">Sign out</button>
      </div>
      <button id="open-dashboard-btn" class="primary" style="width:100%;margin-bottom:8px">🗂 Open Bookmarks Dashboard</button>
      <h2>Recent</h2>
      <ul id="history"></ul>
      <a id="open-options-2" href="#" class="muted">Open options</a>
    </section>

    <section id="anon-dashboard-section">
      <button id="open-dashboard-btn-anon" class="primary" style="width:100%;margin-top:8px">🗂 Open Bookmarks Dashboard</button>
      <p class="muted" style="font-size:11px;margin-top:4px">Bookmarks dashboard works without sign-in. Sign-in only required for transcription history.</p>
    </section>

    <script src="popup.js" type="module"></script>
  </body>
</html>
